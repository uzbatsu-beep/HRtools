<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Briefcase Body / Workstation -->
  <rect x="106" y="180" width="300" height="210" rx="28" fill="#1e293b" stroke="#334155" stroke-width="8"/>
  
  <!-- Briefcase Handle -->
  <path d="M 186 180 L 186 135 C 186 115 202 100 222 100 L 290 100 C 310 100 326 115 326 135 L 326 180" 
        fill="none" stroke="url(#primary)" stroke-width="14" stroke-linecap="round"/>

  <!-- Briefcase Accent Band -->
  <rect x="106" y="240" width="300" height="20" fill="#0f172a"/>

  <!-- Center HR / People Badge -->
  <circle cx="256" cy="275" r="44" fill="url(#badge)" stroke="#0f172a" stroke-width="6"/>
  <circle cx="256" cy="265" r="16" fill="#f8fafc"/>
  <path d="M 232 298 C 232 284 243 277 256 277 C 269 277 280 284 280 298 Z" fill="#f8fafc"/>

  <!-- Tech Indicator / Pulse Dots -->
  <circle cx="140" cy="355" r="8" fill="#10b981"/>
  <circle cx="165" cy="355" r="8" fill="#38bdf8"/>
  <circle cx="190" cy="355" r="8" fill="#a855f7"/>

  <!-- Lock Clasp -->
  <rect x="244" y="234" width="24" height="14" rx="4" fill="#fbbf24"/>
</svg>
